name: PR title

# PRs are squash-merged, so the title ends up as the commit message on main.
# Enforce Conventional Commits (feat:, fix:, docs: …) to keep history readable.
#
# pull_request_target (not pull_request) so the check also gets a token on PRs
# from forks. That's safe here: the job never checks out or runs PR code, it only
# reads the title and commits through the API. The workflow always runs from main,
# so edits to this file take effect after they're merged.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  title:
    name: PR title · conventional commits
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The types from CONTRIBUTING.md, plus the rest of the standard set.
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            ci
            build
            style
            revert
          # A scope is optional: "fix: …" and "fix(editor): …" both pass.
          requireScope: false
          # Lowercase subject, like the existing history ("docs: replace …").
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" should start with a
            lowercase letter, e.g. "fix: crash when replying to a deleted comment".
          # For a single-commit PR, GitHub uses the commit message (not the PR title)
          # as the squash commit, so check that commit too.
          validateSingleCommit: true
