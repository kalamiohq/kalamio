name: CI

# Gate every PR into main (and post-merge pushes) on green frontend + server tests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab — re-run CI by hand on any branch,
  # e.g. when GitHub drops a push/PR event during an incident.
  workflow_dispatch:

# Cancel superseded runs on the same PR (e.g. rapid pushes to a PR branch). Push and
# manual runs each get their own group (run_id), so runs on main are never queued or
# cancelled — every commit there gets its own complete result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: Server · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
