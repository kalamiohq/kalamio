name: ✨ Feature request
description: Suggest an idea or improvement for Kalamio
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs this and why. "As a writer, I want to… so that…" works well.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the solution you have in mind. Mockups or examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      description: >-
        A maintainer adds the `accepted` label once we agree the idea fits Kalamio and how it
        should be built. Please wait for it before writing code — pull requests for features
        without an accepted issue may be closed.
      options:
        - label: I'd like to work on this myself, once the issue is accepted.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been suggested yet.
          required: true
