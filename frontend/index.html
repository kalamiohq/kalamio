<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="description" content="Kalamio is the publishing platform for every voice on earth. Write your ideas, publish your story, reach readers who care" />
    <meta name="keywords" content="blog, writing, stories, articles, editor" />
    <meta name="theme-color" content="#1F1F1E" />
    <link rel="canonical" href="https://kalamio.com" />

    <!-- Open Graph / Twitter defaults. Per-route values are set at runtime via
         useSeo; these are the fallback that non-JS social crawlers see. -->
    <meta property="og:site_name" content="Kalamio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kalamio — publishing for every voice" />
    <meta property="og:description" content="Kalamio is the publishing platform for every voice on earth. Write your ideas, publish your story, reach readers who care." />
    <meta property="og:url" content="https://kalamio.com" />
    <meta property="og:image" content="https://kalamio.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kalamio — Write to the world." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kalamio — publishing for every voice" />
    <meta name="twitter:description" content="Kalamio is the publishing platform for every voice on earth. Write your ideas, publish your story, reach readers who care." />
    <meta name="twitter:image" content="https://kalamio.com/og-image.png" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://platform.twitter.com https://www.instagram.com https://www.tiktok.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
        font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
        img-src 'self' data: blob: http://localhost:* https://*.kalamio.com https://*.amazonaws.com https://lh3.googleusercontent.com https://api.dicebear.com https://pbs.twimg.com https://*.cdninstagram.com;
        connect-src 'self' http://localhost:* ws://localhost:* https://kalamio.com https://dev.kalamio.com wss://kalamio.com wss://dev.kalamio.com https://*.run.app wss://*.run.app https://*.amazonaws.com;
        frame-src https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://www.loom.com https://codepen.io https://www.figma.com https://platform.twitter.com https://www.instagram.com https://gist.github.com https://www.candiq.app;
        object-src 'none';
        base-uri 'self';
    " />
    <title>Kalamio</title>

    <!-- Splash screen styles -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1f1f1e;
        opacity: 1;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50%      { opacity: 1;   transform: scale(1.06); }
      }
    </style>

    <!-- Block search engines on dev environment -->
    <script>
      if (window.location.hostname === 'dev.kalamio.com') {
        var meta = document.createElement('meta');
        meta.name = 'robots';
        meta.content = 'noindex, nofollow';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }
      // Apply saved theme to <html> before first paint so splash bg matches
      (function() {
        try {
          var t = JSON.parse(sessionStorage.getItem('theme') || '""');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Splash — outside #root so React doesn't auto-remove it -->
    <div id="splash" aria-hidden="true">
      <img src="/logo.svg" alt="" width="72" height="72" id="splash-logo" />
    </div>
    <div id="root" role="application" aria-label="Kalamio"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Safety net: dismiss splash even if React crashes -->
    <script>
      setTimeout(function() {
        var s = document.getElementById('splash');
        if (s) {
          s.classList.add('splash-hide');
          setTimeout(function() { s.remove(); }, 500);
        }
      }, 4000);
    </script>
  </body>
</html>
