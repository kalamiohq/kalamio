steps:
  # Step 1: Build Docker image (uses $COMMIT_SHA for traceability)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',

        '--build-arg', 'VITE_SERVER_DOMAIN=https://dev.kalamio.com/',

        # Image CDN — CloudFront-cached S3, served via cdn.kalamio.com.
        '--build-arg', 'VITE_CDN_DOMAIN=https://cdn.kalamio.com',

        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/frontend-dev:$COMMIT_SHA',

        './frontend'
      ]

  # Step 2: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/frontend-dev:$COMMIT_SHA'
      ]

  # Step 3: Deploy to Cloud Run, unless a newer commit on main supersedes this one: builds run
  # in parallel, and an older one can finish last. .cloudbuild/is-superseded.sh exits 0 when a
  # later commit changes frontend/ (the trigger's included files), whose own build deploys
  # instead; the step then ends and the build still passes. The args after the script go to
  # gcloud ('gcloud' is bash's $0; $$ is Cloud Build's escape for $).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      [
        '-c',
        'if bash .cloudbuild/is-superseded.sh "$COMMIT_SHA" frontend/; then exit 0; fi; exec gcloud "$$@"',
        'gcloud',
        'run',
        'deploy',
        'kalamio-web-development',
        '--image',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/frontend-dev:$COMMIT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        # Basic-auth users for dev.kalamio.com, mounted as a file nginx reads. The secret must
        # exist and the runtime service account needs roles/secretmanager.secretAccessor on it.
        '--update-secrets',
        '/etc/nginx/auth/htpasswd=web-dev-htpasswd:latest'
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/frontend-dev:$COMMIT_SHA'

timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
