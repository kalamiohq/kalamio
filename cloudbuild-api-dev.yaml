steps:
  # Step 1: Install dependencies and run security audit
  - name: 'node:22-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'cd server && npm ci --omit=dev && npm audit --audit-level=critical --omit=dev && echo "✅ Dependencies OK"'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA',
        '-f',
        'server/Dockerfile',
        'server'
      ]

  # Step 3: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA'
      ]

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'kalamio-api-development',
        '--image',
        'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        # Sticky sessions so a Socket.IO client stays pinned to one instance (esp. the polling
        # handshake). Cross-instance delivery itself is handled by the Redis adapter (REDIS_URL).
        '--session-affinity',
        # Redis (response caching) is wired from Secret Manager on every deploy.
        # --update-secrets REPLACES the earlier --clear-secrets, so the refs are
        # re-applied each deploy instead of stripped. Secrets must exist with values.
        # All three wired: Redis caching + Cloudflare origin-lock. Verified live —
        # dev.kalamio.com passes with CF's X-Origin-Secret header; direct *.run.app → 403.
        '--update-secrets',
        # REDIS_URL (Socket.IO Redis adapter) is the Upstash REDIS-PROTOCOL string (rediss://…),
        # distinct from the UPSTASH_REDIS_REST_* pair used for response caching. Prerequisite: the
        # `redis-url-dev` secret must exist AND the runtime service account must hold
        # roles/secretmanager.secretAccessor on it, or Cloud Run rejects the deploy. Once deployed,
        # cross-instance Socket.IO broadcast activates (config/socket.js logs "Redis adapter enabled").
        'UPSTASH_REDIS_REST_URL=upstash-redis-rest-url-dev:latest,UPSTASH_REDIS_REST_TOKEN=upstash-redis-rest-token-dev:latest,CLOUDFLARE_ORIGIN_SECRET=cloudflare-origin-secret-dev:latest,REDIS_URL=redis-url-dev:latest',
        # Prerender OG/Twitter images route through the image CDN (cdn.kalamio.com).
        '--update-env-vars',
        'CDN_DOMAIN=https://cdn.kalamio.com'
      ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/kalamio/backend-dev:$COMMIT_SHA'

timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
